; ESP32-C3 Super Mini controlando o painel RGB + branco quente/frio
; (usa o core Arduino-ESP32 3.x via pioarduino)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Super Mini usa USB nativo: Serial precisa do CDC ligado no boot
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Firmware normal (Wi-Fi + controle)
[env:esp32c3_supermini]

; Mesmo firmware, mas ja comeca percorrendo as cores e imprimindo na serial
; pio run -e teste_cores -t upload && pio device monitor
[env:teste_cores]
build_flags =
    ${env.build_flags}
    -DDEMO_ON_BOOT=1
